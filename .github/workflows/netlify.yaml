name: Build and Deploy to Netlify
on:
  push:
    branches:
    - main
    - d/**
  pull_request:
jobs:
  build-stg:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install
        run: yarn

      - name: Lint
        run: yarn lint

      - name: Build voting page stg
        run: yarn build
        env:
          VOCDONI_ENVIRONMENT: dev
          PROCESS_IDS: '["6be21a5a9dc024d3a8c1c4d403de7a56b56f925413109f414d51020400000007"]'

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './dist'
          # keep as a non existant branch, because we don't want to publish this
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Vocdoni DEV Deploy from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: eba70567-ca33-4504-9603-0ddc8c4437c6
        timeout-minutes: 1
